name: Temporary Pass C Formatter

on:
  push:
    branches: [feat/sb-legislation-staging]
    paths:
      - '.github/workflows/apply-pass-c-policy-fix.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/sb-legislation-staging
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Pass C files
        run: >-
          npx prettier --write
          config/data-sources/sbstacruz-legislation.json
          scripts/legislation/sbstacruz/characterize-interactions.ts
          scripts/legislation/sbstacruz/characterize.ts
          scripts/legislation/sbstacruz/collector.test.ts
          scripts/legislation/sbstacruz/collector.ts
          scripts/legislation/sbstacruz/parse.test.ts
          scripts/legislation/sbstacruz/parse.ts
          scripts/legislation/sbstacruz/pilot.ts
          scripts/legislation/sbstacruz/schemas.ts
          .github/workflows/sb-legislation-pilot.yml

      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pass-c-formatted-files
          path: |
            config/data-sources/sbstacruz-legislation.json
            scripts/legislation/sbstacruz/characterize-interactions.ts
            scripts/legislation/sbstacruz/characterize.ts
            scripts/legislation/sbstacruz/collector.test.ts
            scripts/legislation/sbstacruz/collector.ts
            scripts/legislation/sbstacruz/parse.test.ts
            scripts/legislation/sbstacruz/parse.ts
            scripts/legislation/sbstacruz/pilot.ts
            scripts/legislation/sbstacruz/schemas.ts
            .github/workflows/sb-legislation-pilot.yml
          if-no-files-found: error
          retention-days: 7

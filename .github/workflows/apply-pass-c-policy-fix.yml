name: Temporary Pass C Formatter

on:
  push:
    branches: [feat/sb-legislation-staging]
    paths:
      - '.github/workflows/apply-pass-c-policy-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/sb-legislation-staging
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format scoped Pass C files
        run: >-
          npx prettier --write
          config/data-sources/sbstacruz-legislation.json
          scripts/legislation/sbstacruz/characterize-interactions.ts
          scripts/legislation/sbstacruz/characterize.ts
          scripts/legislation/sbstacruz/collector.test.ts
          scripts/legislation/sbstacruz/collector.ts
          scripts/legislation/sbstacruz/parse.test.ts
          scripts/legislation/sbstacruz/parse.ts
          scripts/legislation/sbstacruz/pilot.ts
          scripts/legislation/sbstacruz/schemas.ts
          .github/workflows/sb-legislation-pilot.yml

      - name: Verify scoped diff and tests
        run: |
          git diff --check
          npx vitest run scripts/legislation/sbstacruz/parse.test.ts scripts/legislation/sbstacruz/collector.test.ts
          npx tsc --noEmit

      - name: Commit formatting only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- \
            config/data-sources/sbstacruz-legislation.json \
            scripts/legislation/sbstacruz/characterize-interactions.ts \
            scripts/legislation/sbstacruz/characterize.ts \
            scripts/legislation/sbstacruz/collector.test.ts \
            scripts/legislation/sbstacruz/collector.ts \
            scripts/legislation/sbstacruz/parse.test.ts \
            scripts/legislation/sbstacruz/parse.ts \
            scripts/legislation/sbstacruz/pilot.ts \
            scripts/legislation/sbstacruz/schemas.ts \
            .github/workflows/sb-legislation-pilot.yml; then
            echo "No scoped formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            config/data-sources/sbstacruz-legislation.json \
            scripts/legislation/sbstacruz/characterize-interactions.ts \
            scripts/legislation/sbstacruz/characterize.ts \
            scripts/legislation/sbstacruz/collector.test.ts \
            scripts/legislation/sbstacruz/collector.ts \
            scripts/legislation/sbstacruz/parse.test.ts \
            scripts/legislation/sbstacruz/parse.ts \
            scripts/legislation/sbstacruz/pilot.ts \
            scripts/legislation/sbstacruz/schemas.ts \
            .github/workflows/sb-legislation-pilot.yml
          git commit -m "style(data): format Pass C implementation"
          gh auth setup-git
          git push origin HEAD:feat/sb-legislation-staging

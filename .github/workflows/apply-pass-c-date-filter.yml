name: Temporary Pass C Date Filter Patcher

on:
  push:
    branches: [feat/sb-legislation-staging]
    paths:
      - '.github/workflows/apply-pass-c-date-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'Diannn3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/sb-legislation-staging
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact collector and test changes
        shell: python
        run: |
          from pathlib import Path

          collector = Path('scripts/legislation/sbstacruz/collector.ts')
          text = collector.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "export type SourceKey = 'ordinances' | 'resolutions';\n",
              """export type SourceKey = 'ordinances' | 'resolutions';

          export type SourceDateFilter = {
            fromDate: string;
            toDate: string;
          };

          function assertDateFilter(filter: SourceDateFilter): void {
            const datePattern = /^\\d{4}-\\d{2}-\\d{2}$/;
            if (!datePattern.test(filter.fromDate) || !datePattern.test(filter.toDate)) {
              throw new Error('dateFilter values must use YYYY-MM-DD');
            }
            if (filter.fromDate > filter.toDate) {
              throw new Error('dateFilter.fromDate must be on or before dateFilter.toDate');
            }
          }
""",
              'insert SourceDateFilter'
          )

          replace_once(
              """function buildDataTablesUrl(
            source: SourceDefinition,
            start: number,
            length: number
          ): string {
""",
              """function buildDataTablesUrl(
            source: SourceDefinition,
            start: number,
            length: number,
            dateFilter?: SourceDateFilter
          ): string {
""",
              'buildDataTablesUrl signature'
          )

          replace_once(
              """  url.searchParams.set('to_date', '');
            url.searchParams.set('from_date', '');
""",
              """  url.searchParams.set('to_date', dateFilter?.toDate ?? '');
            url.searchParams.set('from_date', dateFilter?.fromDate ?? '');
""",
              'date query params'
          )

          replace_once(
              """async function fetchWithPolicy(
            rawUrl: string,
            source: SourceDefinition,
            fetchImpl: FetchLike,
            sleep: SleepLike
          ): Promise<Response> {
""",
              """async function fetchWithPolicy(
            rawUrl: string,
            source: SourceDefinition,
            fetchImpl: FetchLike,
            sleep: SleepLike,
            onStatus?: (status: number) => void
          ): Promise<Response> {
""",
              'fetchWithPolicy signature'
          )

          replace_once(
              """      if (response.status === 403) {
""",
              """      if (response.status === 403 || response.status === 429) {
                onStatus?.(response.status);
              }

              if (response.status === 403) {
""",
              'status telemetry'
          )

          replace_once(
              """          await sleep(retryAfterMs);
""",
              """          await sleep(Math.max(DEFAULT_DELAY_MS, retryAfterMs));
""",
              'Retry-After minimum delay'
          )

          replace_once(
              """          await sleep(1_000 * 2 ** attempt);
""",
              """          await sleep(Math.max(DEFAULT_DELAY_MS, 1_000 * 2 ** attempt));
""",
              '5xx minimum delay'
          )

          replace_once(
              """        await sleep(1_000 * 2 ** attempt);
""",
              """        await sleep(Math.max(DEFAULT_DELAY_MS, 1_000 * 2 ** attempt));
""",
              'network minimum delay'
          )

          replace_once(
              """async function verifySourceIdentity(
            source: SourceDefinition,
            fetchImpl: FetchLike,
            sleep: SleepLike
          ): Promise<void> {
""",
              """async function verifySourceIdentity(
            source: SourceDefinition,
            fetchImpl: FetchLike,
            sleep: SleepLike,
            onStatus?: (status: number) => void
          ): Promise<void> {
""",
              'verifySourceIdentity signature'
          )

          replace_once(
              """    fetchImpl,
                sleep
              );
""",
              """    fetchImpl,
                sleep,
                onStatus
              );
""",
              'verifySourceIdentity fetch call'
          )

          replace_once(
              """async function fetchDataPage(
            source: SourceDefinition,
            start: number,
            length: number,
            fetchImpl: FetchLike,
            sleep: SleepLike
          ): Promise<DataTablesResponse> {
            const endpoint = buildDataTablesUrl(source, start, length);
            const response = await fetchWithPolicy(endpoint, source, fetchImpl, sleep);
""",
              """async function fetchDataPage(
            source: SourceDefinition,
            start: number,
            length: number,
            dateFilter: SourceDateFilter | undefined,
            fetchImpl: FetchLike,
            sleep: SleepLike,
            onStatus?: (status: number) => void
          ): Promise<DataTablesResponse> {
            const endpoint = buildDataTablesUrl(source, start, length, dateFilter);
            const response = await fetchWithPolicy(
              endpoint,
              source,
              fetchImpl,
              sleep,
              onStatus
            );
""",
              'fetchDataPage signature/body'
          )

          replace_once(
              """export async function collectSource(options: {
            sourceKey: SourceKey;
            limit: number;
            fetchImpl?: FetchLike;
""",
              """export async function collectSource(options: {
            sourceKey: SourceKey;
            limit: number;
            dateFilter?: SourceDateFilter;
            fetchImpl?: FetchLike;
""",
              'collectSource options'
          )

          replace_once(
              """  if (options.limit > HARD_MAX_RECORDS) {
                throw new Error(
                  `limit ${options.limit} exceeds hard safety cap ${HARD_MAX_RECORDS}`
                );
              }

              const startedAt = now().toISOString();
""",
              """  if (options.limit > HARD_MAX_RECORDS) {
                throw new Error(
                  `limit ${options.limit} exceeds hard safety cap ${HARD_MAX_RECORDS}`
                );
              }
              if (options.dateFilter) assertDateFilter(options.dateFilter);

              const startedAt = now().toISOString();
""",
              'dateFilter validation'
          )

          replace_once(
              """  let shapeFailures = 0;
              let status: 'success' | 'partial' | 'failed' = 'success';
""",
              """  let shapeFailures = 0;
              const recordStatus = (responseStatus: number) => {
                if (responseStatus === 403) http403 += 1;
                if (responseStatus === 429) http429 += 1;
              };
              let status: 'success' | 'partial' | 'failed' = 'success';
""",
              'status counter callback'
          )

          replace_once(
              """    await verifySourceIdentity(source, fetchImpl, sleep);
""",
              """    await verifySourceIdentity(source, fetchImpl, sleep, recordStatus);
""",
              'identity telemetry call'
          )

          replace_once(
              """        length,
                    fetchImpl,
                    sleep
                  );
""",
              """        length,
                    options.dateFilter,
                    fetchImpl,
                    sleep,
                    recordStatus
                  );
""",
              'data page call'
          )

          replace_once(
              """      if (error.kind === 'http_403') http403 += 1;
                  if (error.kind === 'http_429') http429 += 1;
                  if (error.kind === 'unexpected_response_shape') shapeFailures += 1;
""",
              """      if (error.kind === 'unexpected_response_shape') shapeFailures += 1;
""",
              'remove final-only status counting'
          )

          collector.write_text(text)

          tests = Path('scripts/legislation/sbstacruz/collector.test.ts')
          test_text = tests.read_text()

          def test_replace(old, new, label):
              global test_text
              count = test_text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              test_text = test_text.replace(old, new, 1)

          test_replace(
              "expect(result.manifest.http429).toBe(0);",
              "expect(result.manifest.http429).toBe(1);",
              'recovered 429 telemetry'
          )
          test_replace(
              "expect(result.manifest.http429).toBe(1);\n            expect(fetchImpl).toHaveBeenCalledTimes(3);\n            expect(sleep).toHaveBeenCalledWith(1_000);",
              "expect(result.manifest.http429).toBe(2);\n            expect(fetchImpl).toHaveBeenCalledTimes(3);\n            expect(sleep).toHaveBeenCalledWith(2_500);",
              'repeated 429 telemetry/min delay'
          )
          test_replace(
              "expect(sleep).toHaveBeenCalledWith(1_000);\n            expect(sleep).toHaveBeenCalledWith(2_000);",
              "expect(sleep).toHaveBeenCalledTimes(3);\n            expect(sleep).toHaveBeenNthCalledWith(1, 2_500);\n            expect(sleep).toHaveBeenNthCalledWith(2, 2_500);\n            expect(sleep).toHaveBeenNthCalledWith(3, 2_500);",
              '5xx minimum delays'
          )

          marker = """  it('rejects non-JSON and unexpected response shapes without staging records', async () => {
"""
          addition = """  it('sends only the characterized public date-range parameters when requested', async () => {
            const fetchImpl = vi
              .fn<typeof fetch>()
              .mockResolvedValueOnce(sourcePage())
              .mockResolvedValueOnce(dataResponse([ordinanceRow(362)]));

            const result = await collectSource({
              sourceKey: 'ordinances',
              limit: 1,
              dateFilter: {
                fromDate: '2024-01-01',
                toDate: '2024-12-31',
              },
              fetchImpl,
              sleep: noSleep,
              delayMs: 0,
              now: fixedNow,
            });

            expect(result.manifest.status).toBe('success');
            const requestUrl = String(fetchImpl.mock.calls[1][0]);
            const url = new URL(requestUrl);
            expect(url.searchParams.get('from_date')).toBe('2024-01-01');
            expect(url.searchParams.get('to_date')).toBe('2024-12-31');
            expect(url.searchParams.get('titleFilter')).toBe('');
            expect(url.searchParams.get('tagFilter')).toBe('');
          });

          it('rejects malformed or reversed date filters before network access', async () => {
            const fetchImpl = vi.fn<typeof fetch>();

            await expect(
              collectSource({
                sourceKey: 'ordinances',
                limit: 1,
                dateFilter: { fromDate: '2024-1-1', toDate: '2024-12-31' },
                fetchImpl,
                sleep: noSleep,
                now: fixedNow,
              })
            ).rejects.toThrow('YYYY-MM-DD');

            await expect(
              collectSource({
                sourceKey: 'ordinances',
                limit: 1,
                dateFilter: { fromDate: '2025-01-01', toDate: '2024-12-31' },
                fetchImpl,
                sleep: noSleep,
                now: fixedNow,
              })
            ).rejects.toThrow('on or before');
            expect(fetchImpl).not.toHaveBeenCalled();
          });

"""
          if marker not in test_text:
              raise SystemExit('date-filter test insertion marker missing')
          test_text = test_text.replace(marker, addition + marker, 1)
          tests.write_text(test_text)

      - name: Format and validate exact files
        run: |
          npx prettier --write scripts/legislation/sbstacruz/collector.ts scripts/legislation/sbstacruz/collector.test.ts
          git diff --check
          npx vitest run scripts/legislation/sbstacruz/collector.test.ts scripts/legislation/sbstacruz/parse.test.ts
          npx tsc --noEmit
          npm run lint

      - name: Commit only reviewed adapter changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/legislation/sbstacruz/collector.ts scripts/legislation/sbstacruz/collector.test.ts
          git diff --cached --check
          git commit -m "feat(data): add characterized SB date-filter collection"
          gh auth setup-git
          git push origin HEAD:feat/sb-legislation-staging

name: Temporary Evidence Branch Formatter

on:
  push:
    branches: [refactor/evidence-model-v2]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refactor/evidence-model-v2
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Pass B files
        run: >-
          npx prettier --write
          src/data/civic-registry.json
          src/data/directory/executive.json
          src/data/sources/source-registry.json
          src/lib/canonical-data.test.ts
          src/lib/canonical-data.ts
          src/lib/evidence/*.ts
          src/lib/provenance.test.ts
          src/lib/provenance.ts
          src/lib/source-filter.test.ts
          src/lib/source-filter.ts
          src/lib/source-registry.test.ts
          src/lib/source-summary.test.ts
          src/lib/source-summary.ts
          src/pages/Sources.tsx
          scripts/migrate-evidence-v2.ts
          scripts/validate-civic-data.ts
          docs/research/pagsanjan/*.json
          docs/research/pagsanjan/*.md

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style(data): format evidence v2 changes"
          git push origin HEAD:refactor/evidence-model-v2

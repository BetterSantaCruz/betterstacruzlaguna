name: Contribution review gate

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to review manually'
        required: true
        type: string

permissions:
  contents: read
  issues: read

jobs:
  review-gate:
    name: Prepare a non-mutating review check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate current civic data
        run: npm run validate:data

      - name: State the manual promotion boundary
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          echo "Review issue #${ISSUE_NUMBER} manually against the source policy."
          echo "This workflow never edits, commits, or pushes civic data."
          echo "A maintainer must make any evidence-backed change in a reviewed commit."

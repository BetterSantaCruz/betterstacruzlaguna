name: Temporary SB Legislation Characterization

# One-shot Pass C research workflow. Remove before the pass is merged.
on:
  push:
    branches: [feat/sb-legislation-staging]
    paths:
      - '.github/workflows/characterize-sb-legislation.yml'
      - 'scripts/legislation/sbstacruz/characterize-interactions.ts'

permissions:
  contents: read

jobs:
  characterize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/sb-legislation-staging
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Characterize public pagination and filters
        run: >-
          npx tsx scripts/legislation/sbstacruz/characterize-interactions.ts
          --output pipeline/openlgu/sbstacruz-legislation/characterization/interactions.json

      - name: Upload characterization artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sb-legislation-interactions
          path: pipeline/openlgu/sbstacruz-legislation/characterization/interactions.json
          if-no-files-found: error
          retention-days: 7
